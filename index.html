<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AES Fahrzeugaufbereitung</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b10;
      color: white;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      width: 100%;

      /* FIX: besseres Background-Cropping */
      background-image: url('background.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center 25%; /* wichtig: verhindert abgeschnittenes Logo */

      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* dunkler Overlay für bessere Lesbarkeit */
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #6a00ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4b00b5;
    }

    /* SECTIONS */
    section {
      padding: 80px 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 2rem;
    }

    /* KONTAKT */
    .kontakt-box {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .kontakt-item {
      background: #151520;
      padding: 15px 25px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .kontakt-item:hover {
      background: #6a00ff;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-content">

      <h1>Glanz, der bleibt.</h1>

      <p>
        Fahrzeugpflege auf höchstem Niveau – mit Leidenschaft fürs Detail.
      </p>

      <a href="#kontakt" class="btn">Kontakt aufnehmen</a>

    </div>
  </header>

  <!-- KONTAKT -->
  <section id="kontakt">
    <h2>Kontakt</h2>

    <p>Du erreichst uns schnell und einfach über folgende Kanäle:</p>

    <div class="kontakt-box">

      <a href="tel:+49DEINNUMMER" class="kontakt-item">
        📞 Telefon
      </a>

      <a href="https://wa.me/49DEINNUMMER" target="_blank" class="kontakt-item">
        💬 WhatsApp
      </a>

      <a href="https://instagram.com/DEINACCOUNT" target="_blank" class="kontakt-item">
        📸 Instagram
      </a>

    </div>
  </section>

</body>
</html>
